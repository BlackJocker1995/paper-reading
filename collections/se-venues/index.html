<style>
:root{
  --ground:#f3f6f6;
  --surface:#ffffff;
  --surface-2:#eceff0;
  --ink:#13181b;
  --ink-2:#3d4850;
  --muted:#68757d;
  --line:#d9e0e2;
  --line-soft:#e6ebec;
  --se:#0f6e66;
  --se-soft:#dceceb;
  --ai:#9c2f52;
  --ai-soft:#f6e2e7;
  --gold:#8a6a12;
  --focus:#0f6e66;
  --shadow:0 1px 2px rgba(19,24,27,.06),0 8px 24px -16px rgba(19,24,27,.28);
  --cjk:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1114;
    --surface:#151a1e;
    --surface-2:#1c2328;
    --ink:#e4e9eb;
    --ink-2:#b3bfc5;
    --muted:#8697a0;
    --line:#2a343a;
    --line-soft:#222b30;
    --se:#4cb5a9;
    --se-soft:#12322f;
    --ai:#e2778f;
    --ai-soft:#361a23;
    --gold:#c9a441;
    --focus:#4cb5a9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1114;
  --surface:#151a1e;
  --surface-2:#1c2328;
  --ink:#e4e9eb;
  --ink-2:#b3bfc5;
  --muted:#8697a0;
  --line:#2a343a;
  --line-soft:#222b30;
  --se:#4cb5a9;
  --se-soft:#12322f;
  --ai:#e2778f;
  --ai-soft:#361a23;
  --gold:#c9a441;
  --focus:#4cb5a9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.zh{font-family:var(--cjk)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
a{color:var(--se);text-underline-offset:2px}

/* ---------- masthead ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line)}
.mast{background:var(--surface)}
.mast-in{
  max-width:1560px;margin:0 auto;padding-block:14px;padding-left:20px;padding-right:20px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;
}
.brand-home{color:inherit;text-decoration:none}
.brand-home:hover{color:var(--se)}
.brand h1{
  font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;margin:0;
  letter-spacing:-.012em;text-wrap:balance;
}
.brand .sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-top:5px;
}
.counts{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;align-items:flex-end}
.count{display:flex;flex-direction:column;gap:1px}
.count b{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.count span{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- controls ---------- */
.controls{border-top:1px solid var(--line-soft);background:var(--surface)}
.controls-in{

  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
}
.search{
  flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--ground);border:1px solid var(--line);border-radius:2px;padding:6px 10px;
}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:13.5px}
.search input::placeholder{color:var(--muted)}
.search kbd{
  font-family:var(--mono);font-size:10px;color:var(--muted);

}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

.chip{

}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- shell ---------- */
.shell{

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--line-soft);

<script src="data/ledger.js"></script>
<script>
;
const DATA = window.__SE_ATLAS__;
const P = DATA.papers, THEMES = DATA.themes, TAGS = DATA.tags;

const VENUES = ["ICSE 2026","FSE 2026","ASE 2026","ISSTA 2026"];
const topicOf = {}, themeOfTopic = {};
THEMES.forEach(th => th.topics.forEach(t => { topicOf[t.id] = t; themeOfTopic[t.id] = th; }));
const tagName = {}; TAGS.forEach(t => tagName[t.id] = t.zh);

const state = { topic:null, theme:null, venues:new Set(), q:"", limit:60, open:new Set() };

/* 保持源数据顺序（按会议、再按会议列表顺序） */
P.forEach((p,i) => { p._i = i; });
function ordered(xs){ return xs.slice().sort((a,b) => a._i-b._i); }

/* ---------- search index ---------- */
P.forEach(p => {
  p._s = [p.t, p.tz, p.a, p.az, p.tl, (p.au||[]).join(" "), (p.kw||[]).join(" "), p.v]
          .filter(Boolean).join(" ").toLowerCase();   // 86 篇还没有摘要，别把 undefined 拼进去
});

function matches(p){
  if (state.venues.size && !state.venues.has(p.v)) return false;
  if (state.q && !p._s.includes(state.q)) return false;
  return true;
}
function pool(){ return ordered(P.filter(matches)); }

function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s){
  if(!state.q) return esc(s);
  const i = String(s||"").toLowerCase().indexOf(state.q);
  if(i<0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i,i+state.q.length)) + "</mark>" + esc(s.slice(i+state.q.length));
}

/* ---------- header counts ---------- */
function renderCounts(){
  const cur = pool();
  const n = {}; cur.forEach(p => n[p.v] = (n[p.v]||0)+1);
  document.getElementById("counts").innerHTML =
    `<div class="count"><b>${cur.length}</b><span>in view</span></div>` +
    VENUES.map(v => `<div class="count se"><b>${n[v]||0}</b><span>${v.split(" ")[0]}</span></div>`).join("");
}

/* ---------- rail ---------- */
function renderTree(){
  const cur = pool();
  const byTopic = {}, byTheme = {};
  cur.forEach(p => { byTopic[p.top]=(byTopic[p.top]||0)+1; const th=themeOfTopic[p.top]; if(th) byTheme[th.id]=(byTheme[th.id]||0)+1; });
  const max = Math.max(1, ...Object.values(byTopic));
  document.getElementById("tree").innerHTML = THEMES.map(th => {
    const n = byTheme[th.id]||0;
    const open = state.open.has(th.id) || (state.topic && themeOfTopic[state.topic]?.id===th.id);
    const topics = th.topics.map(t => {
      const c = byTopic[t.id]||0;
      return `<button class="topic-btn" type="button" data-topic="${t.id}" aria-current="${state.topic===t.id}"${c?"":' style="opacity:.42"'}>
        <span class="topic-zh">${esc(t.zh)}</span><span class="topic-n">${c}</span>
        <span class="bar"><i style="width:${Math.round(c/max*100)}%"></i></span></button>`;
    }).join("");
    return `<div class="theme" data-scope="${th.scope}" data-open="${open?1:0}">
      <button class="theme-btn" type="button" data-theme="${th.id}">
        <span class="tw"></span>
        <span class="theme-txt"><span class="theme-zh">${esc(th.zh)}</span><span class="theme-en">${esc(th.en)}</span></span>
        <span class="theme-n">${n}</span><span class="caret">▶</span>
      </button><div class="topics">${topics}</div></div>`;
  }).join("");
}

/* ---------- main ---------- */
function paperRow(p){
  const th = themeOfTopic[p.top], tp = topicOf[p.top];
  const tags = (p.tg||[]).map(t=>`<span class="tag">${esc(tagName[t]||t)}</span>`).join("");
  const topicTag = state.topic ? "" : `<span class="tag">${esc(tp?tp.zh:p.top)}</span>`;
  return `<article class="row" data-pid="${p.id}">
    <button class="row-btn" type="button" aria-expanded="false">
      <span class="meta">
        <span class="ven se">${esc(p.v)}</span>
        <span class="kind">${esc(p.k)}</span>
        ${p.aw?`<span class="award">★ Distinguished<br>Paper Award</span>`:""}
      </span>
      <span class="ti">${hl(p.t)}</span>
      ${p.tz?`<span class="ti-zh">${hl(p.tz)}</span>`:""}
      ${p.tl?`<span class="tldr">▸ ${hl(p.tl)}</span>`:""}
      <span class="rowtags">
        <span class="row-toggle" data-toggle>展开摘要 · 中英对照</span>
        <span class="au">${esc(p.au.length>4 ? p.au[0] + " … " + p.au[p.au.length-1] : p.au.join(", "))}${p.au.length>4?` · ${p.au.length} 人`:""}</span>
        ${topicTag}${tags}
      </span>
    </button>
  </article>`;
}

function panelHTML(p){
  const tp = topicOf[p.top], th = themeOfTopic[p.top];
  const links = [];
  if (p.pu) links.push(`<a href="${esc(p.pu)}" target="_blank" rel="noopener">arXiv / OpenReview ↗</a>`);
  if (p.u)  links.push(`<a href="${esc(p.u)}" target="_blank" rel="noopener">会议页面 ↗</a>`);
  const en = p.a ? `<p>${hl(p.a)}</p>` : `<p class="nope">该论文尚未公开摘要（部分新录用论文暂无预印本）。</p>`;
  const zh = p.az ? `<p>${hl(p.az)}</p>` : `<p class="nope">无摘要可译。</p>`;
  return `<div class="panel">
    <div class="authors-full"><h4>Authors · ${p.au.length}</h4><div class="au-list">${esc(p.au.join(" · "))}</div></div>
    <div><h4>Abstract</h4><div class="abs">${en}</div></div>
    <div><h4>中文翻译</h4><div class="abs zh">${zh}</div></div>
    <div class="foot">
      <span class="note">主题：${esc(th?th.zh:"")} › ${esc(tp?tp.zh:p.top)}${p.alt&&topicOf[p.alt]?`（次选：${esc(topicOf[p.alt].zh)}）`:""}</span>
      ${links.join("")}
      <span class="pid">${esc(p.id)}</span>
    </div>
  </div>`;
}

function renderMain(){
  const main = document.getElementById("main");
  const cur = pool();

  if (!state.topic && !state.theme && !state.q) {
    const byTheme = {};
    cur.forEach(p => { const th=themeOfTopic[p.top]; if(th){ (byTheme[th.id] ||= {}); byTheme[th.id][p.v]=(byTheme[th.id][p.v]||0)+1; } });
    main.innerHTML =
      `<div class="head"><h2 class="zh">全部主题</h2><span class="en">${THEMES.length} themes · ${THEMES.reduce((s,t)=>s+t.topics.length,0)} topics</span>
        <span class="n">${cur.length} papers</span></div>
       <p class="head-def zh">左侧按主题浏览，或点开下面任一主题。收录 ICSE / FSE / ASE / ISSTA 2026 研究轨道的全部录用论文，每篇配中文标题、一句话概括与摘要中译。色条显示每个主题里四个会议的构成。</p>
       <div class="ov-legend">${VENUES.map((v,i)=>`<span style="opacity:${1-i*0.2}">▬ ${v}</span>`).join("")}</div>
       <div style="height:12px"></div>
       <div class="ov">${THEMES.map(th=>{
         const d = byTheme[th.id]||{}; const sum=VENUES.reduce((s,v)=>s+(d[v]||0),0);
         return `<button class="ov-card" type="button" data-theme-card="${th.id}" data-scope="${th.scope}">
           <span class="ov-top"><span class="zh">${esc(th.zh)}</span><span class="n">${sum}</span></span>
           <span class="ov-en">${esc(th.en)} · ${th.topics.length} topics</span>
           <span class="ov-blurb">${esc(th.blurb)}</span>
           <span class="ov-split">${VENUES.map(v=>`<i style="width:${(d[v]||0)/(sum||1)*100}%"></i>`).join("")}</span>
         </button>`}).join("")}</div>`;
    return;
  }

  let list, title, sub, def = "", kws = "";
  if (state.topic) {
    const tp = topicOf[state.topic], th = themeOfTopic[state.topic];
    list = cur.filter(p => p.top === state.topic);
    title = tp.zh; sub = tp.en; def = tp.def;
    kws = tp.kw.map(k=>`<span class="kw">${esc(k)}</span>`).join("");
  } else if (state.theme) {
    const th = THEMES.find(t=>t.id===state.theme);
    const ids = new Set(th.topics.map(t=>t.id));
    list = cur.filter(p => ids.has(p.top));
    title = th.zh; sub = th.en; def = th.blurb;
  } else {
    list = cur; title = "搜索结果"; sub = `“${state.q}”`;
  }

  const shown = list.slice(0, state.limit);
  main.innerHTML =
    `<div class="head"><h2 class="zh">${esc(title)}</h2><span class="en">${esc(sub)}</span>
       <span class="n">${list.length} papers</span></div>
     ${def?`<p class="head-def zh">${esc(def)}</p>`:""}
     ${kws?`<div class="head-kw">${kws}</div>`:'<div style="height:8px"></div>'}
     ${shown.length ? `<div class="list">${shown.map(paperRow).join("")}</div>` : `<p class="empty">没有符合当前筛选条件的论文。</p>`}
     ${list.length>shown.length?`<button class="more" type="button" id="moreBtn">再显示 ${Math.min(60,list.length-shown.length)} 篇（共 ${list.length} 篇）</button>`:""}`;
}

function render(){ renderCounts(); renderTree(); renderMain(); }

/* ---------- controls ---------- */
const venWrap = document.getElementById("venues");
VENUES.forEach(v => {
  const b = document.createElement("button");
  b.type="button"; b.className = "chip se";
  b.textContent = v; b.setAttribute("aria-pressed","false"); b.dataset.venue = v;
  venWrap.appendChild(b);
});

document.addEventListener("click", e => {
  const ven = e.target.closest("[data-venue]");
  if (ven){ const v=ven.dataset.venue;
    if(state.venues.has(v)) state.venues.delete(v); else state.venues.add(v);
    ven.setAttribute("aria-pressed", state.venues.has(v));
    state.limit=60; render(); return; }

  const tc = e.target.closest("[data-theme-card]");
  if (tc){ state.theme=tc.dataset.themeCard; state.topic=null; state.open.add(state.theme);
    state.limit=60; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }

  const th = e.target.closest("[data-theme]");
  if (th){ const id=th.dataset.theme;
    if(state.open.has(id)&&state.theme===id){ state.open.delete(id); state.theme=null; }
    else { state.open.add(id); state.theme=id; state.topic=null; }
    state.limit=60; render(); return; }

  const tp = e.target.closest("[data-topic]");
  if (tp){ state.topic = state.topic===tp.dataset.topic ? null : tp.dataset.topic;
    state.theme=null; state.limit=60; render();
    document.getElementById("main").scrollIntoView({block:"start",behavior:"smooth"}); return; }

  if (e.target.closest("#resetBtn")){ state.topic=null; state.theme=null; state.limit=60; render(); return; }
  if (e.target.closest("#moreBtn")){ state.limit+=60; renderMain(); return; }

  const rb = e.target.closest(".row-btn");
  if (rb){
    const sel = window.getSelection && window.getSelection().toString();
    if (sel && sel.length > 1 && !e.target.closest("[data-toggle]")) return;  // user was selecting text
    const row = rb.closest(".row");
    const open = rb.getAttribute("aria-expanded")==="true";
    rb.setAttribute("aria-expanded", String(!open));
    const ex = row.querySelector(".panel");
    row.dataset.open = open ? "0" : "1";
    const tg = row.querySelector("[data-toggle]");
    if (tg) tg.textContent = open ? "展开摘要 · 中英对照" : "收起摘要";
    if (open){ ex && ex.remove(); }
    else { const p = P.find(x=>x.id===row.dataset.pid); row.insertAdjacentHTML("beforeend", panelHTML(p)); }
  }
});

const qEl = document.getElementById("q");
let qt;
qEl.addEventListener("input", () => {
  clearTimeout(qt);
  qt = setTimeout(()=>{ state.q = qEl.value.trim().toLowerCase(); state.limit=60; render(); }, 160);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if (e.key === "Escape" && document.activeElement === qEl){ qEl.value=""; state.q=""; state.limit=60; render(); qEl.blur(); }
});

function syncTopbar(){
  const h = document.querySelector(".topbar").offsetHeight;
  document.documentElement.style.setProperty("--topbar", h + "px");
}
window.addEventListener("resize", syncTopbar);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTopbar);

render();
syncTopbar();
</script>

</body></html>
